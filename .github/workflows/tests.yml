name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Explicit bash enables pipefail, so tee cannot hide a failed readiness check.
defaults:
  run:
    shell: bash

jobs:
  # The offline half of the suite: FakeClient stands in for the server, so this runs on every
  # supported PHP without a container behind it
  unit:
    name: unit / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, mbstring, json
          coverage: none

      - name: Cache the composer files
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      # update, not install: a library ships no composer.lock, so this checks the current
      # dependencies as well
      - name: Install the dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run the unit tests
        run: |
          mkdir -p build/ci
          vendor/bin/phpunit --testsuite unit --fail-on-skipped --fail-on-incomplete --log-junit build/ci/junit.xml

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-php-${{ matrix.php }}
          path: build/ci/
          retention-days: 14

  # The half that needs a live server, on the two ends of the supported range
  integration:
    name: integration / PHP ${{ matrix.php }} / Manticore ${{ matrix.manticore }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            manticore: '29.9.0'
          - php: '8.4'
            manticore: '29.9.0'
          - php: '8.4'
            manticore: latest

    services:
      manticore:
        image: manticoresearch/manticore:${{ matrix.manticore }}
        ports:
          # the ports the tests expect by default, see MANTICORE_HOST/MANTICORE_PORT
          # in phpunit.xml
          - 9306:9306
          - 9308:9308

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, mbstring, json
          coverage: none

      - name: Cache the composer files
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install the dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      # Probe from the runner with PDO: an open TCP port does not mean Buddy or MCL is ready.
      - name: Check SQL, Columnar, KNN and Buddy
        timeout-minutes: 3
        run: |
          mkdir -p build/ci
          php tests/ci/check-manticore.php 2>&1 | tee build/ci/preflight.log

      # the whole suite here: the unit half is cheap and keeps this job self-contained
      - name: Run the tests
        run: vendor/bin/phpunit --fail-on-skipped --fail-on-incomplete --log-junit build/ci/junit.xml

      - name: Collect Manticore diagnostics
        if: always()
        env:
          MANTICORE_CONTAINER: ${{ job.services.manticore.id }}
        run: |
          mkdir -p build/ci
          docker logs --timestamps "$MANTICORE_CONTAINER" > build/ci/manticore.log 2>&1
          docker inspect "$MANTICORE_CONTAINER" > build/ci/container.json

      - name: Upload integration test report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-php-${{ matrix.php }}-manticore-${{ matrix.manticore }}
          path: build/ci/
          retention-days: 14

  # TODO: a job against an older server would be worth having - the builder deliberately
  # supports the answers of Manticore before v6 (the "Index" column of SHOW TABLES, the
  # "index_type" of SHOW TABLE STATUS), and none of those branches is ever executed against
  # ":latest". It only takes this same job with the image pinned to a tag of the previous
  # major version - pick one that really exists on Docker Hub.
